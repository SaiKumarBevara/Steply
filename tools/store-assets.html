<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Steply — Chrome Web Store asset studio</title>
  <!--
    Generates the images the Chrome Web Store listing needs, at exactly the pixel sizes it
    demands, and downloads them as PNGs.

    Open this file directly in Chrome (double-click it). It is a development tool only — it
    lives in tools/ rather than src/ so the build never copies it into dist/ and it is never
    part of the published extension.

    Everything renders on a canvas at the exact target size, so there is no scaling or
    screenshot-of-a-screenshot loss. The logo is inlined as base64 rather than loaded from
    ../images/, because a file:// image would taint the canvas and make toBlob() throw.
    Screenshots you load come in through FileReader, which is also untainted.
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #185FA5;
      --blue-light: #E6F1FB;
      --dark: #111827;
      --grey: #6B7280;
      --line: #E5E7EB;
      --bg: #F9FAFB;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--dark);
      display: flex;
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── Controls ── */
    aside {
      width: 330px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 22px;
      overflow-y: auto;
      height: 100vh;
    }

    aside h1 { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
    aside .sub { font-size: 12px; color: var(--grey); margin-bottom: 20px; }

    .group { margin-bottom: 18px; }
    .group > label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--grey);
      margin-bottom: 7px;
    }

    select, input[type=text], textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font: inherit;
      font-size: 13px;
      background: #fff;
      color: var(--dark);
    }

    textarea { resize: vertical; min-height: 56px; line-height: 1.45; }
    select:focus, input:focus, textarea:focus { outline: 2px solid var(--blue-light); border-color: var(--blue); }

    input[type=file] { font-size: 12px; width: 100%; }

    .seg { display: flex; gap: 6px; flex-wrap: wrap; }
    .seg button {
      flex: 1;
      min-width: 70px;
      padding: 7px 4px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      color: var(--grey);
    }
    .seg button.on { background: var(--blue-light); border-color: var(--blue); color: var(--blue); font-weight: 600; }

    .hint { font-size: 11.5px; color: var(--grey); line-height: 1.5; margin-top: 7px; }
    .warn { font-size: 11.5px; color: #B45309; line-height: 1.5; margin-top: 7px; display: none; }

    #dl {
      width: 100%;
      padding: 11px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #dl:hover { background: #15518d; }
    #dl:disabled { background: #9CA3AF; cursor: default; }

    /* ── Preview ── */
    main {
      flex: 1;
      padding: 28px;
      overflow: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .sizetag {
      font-size: 12px;
      color: var(--grey);
      font-variant-numeric: tabular-nums;
    }

    #wrap {
      background:
        linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%),
        linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%) 10px 10px,
        #fff;
      background-size: 20px 20px;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.09);
      line-height: 0;
    }

    canvas { max-width: 100%; height: auto; display: block; }
  </style>
</head>

<body>

  <aside>
    <h1>Store asset studio</h1>
    <p class="sub">Renders Chrome Web Store images at exact size.</p>

    <div class="group">
      <label>Asset</label>
      <div class="seg" id="assetSeg">
        <button data-asset="screenshot" class="on">Screenshot</button>
        <button data-asset="tile">Small tile</button>
        <button data-asset="marquee">Marquee</button>
      </div>
      <p class="hint" id="assetHint"></p>
    </div>

    <div class="group" id="shotGroup">
      <label>Your screenshot</label>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" />
      <p class="hint">Capture the real UI first (Win+Shift+S), then load it here. It gets framed and placed for you.</p>
      <p class="warn" id="shotWarn"></p>
    </div>

    <div class="group" id="presetGroup">
      <label>Preset</label>
      <select id="preset"></select>
    </div>

    <div class="group">
      <label>Headline</label>
      <input type="text" id="headline" />
    </div>

    <div class="group">
      <label>Subtitle</label>
      <textarea id="subtitle"></textarea>
    </div>

    <div class="group">
      <label>Theme</label>
      <div class="seg" id="themeSeg">
        <button data-theme="light" class="on">Light</button>
        <button data-theme="blue">Blue</button>
        <button data-theme="dark">Dark</button>
      </div>
    </div>

    <div class="group" id="fitGroup">
      <label>Image fit</label>
      <div class="seg" id="fitSeg">
        <button data-fit="contain" class="on">Fit (no crop)</button>
        <button data-fit="cover">Fill (crops)</button>
      </div>
      <p class="hint">Fit shows the whole screenshot. Fill removes the letterboxing but cuts the edges.</p>
    </div>

    <button id="dl">Download PNG</button>
    <p class="hint" id="dlHint"></p>
  </aside>

  <main>
    <span class="sizetag" id="sizetag"></span>
    <div id="wrap"><canvas id="cv"></canvas></div>
  </main>

    // ── Canvas helpers ────────────────────────────────────────────────────────
    const FONT = '"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif';

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
    }

    // Greedy wrap. Returns the lines rather than drawing, so the caller can centre the
    // whole block vertically once it knows how tall it ended up.
    function wrap(text, maxW) {
      const words = String(text).split(/\s+/).filter(Boolean);
      if (!words.length) return [];
      const lines = [];
      let line = words[0];
      for (let i = 1; i < words.length; i++) {
        const test = line + ' ' + words[i];
        if (ctx.measureText(test).width > maxW) { lines.push(line); line = words[i]; }
        else line = test;
      }
      lines.push(line);
      return lines;

    function drawLines(lines, cx, y, lh) {
      lines.forEach((l, i) => ctx.fillText(l, cx, y + i * lh));

    function lockup(cx, y, size, color) {
      const gap = size * 0.34;
      ctx.font = `600 ${size * 0.82}px ${FONT}`;
      const tw = ctx.measureText('Steply').width;
      const total = size + gap + tw;
      const x = cx - total / 2;

      if (logoReady) {
        ctx.save();
        roundRect(x, y - size / 2, size, size, size * 0.22);
        ctx.clip();
        ctx.drawImage(logo, x, y - size / 2, size, size);
        ctx.restore();
      }

      ctx.fillStyle = color;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('Steply', x + size + gap, y + size * 0.02);
      ctx.textAlign = 'center';
    }

    function background(w, h, t) {
      const g = ctx.createLinearGradient(0, 0, w * 0.4, h);
      g.addColorStop(0, t.from);
      g.addColorStop(1, t.to);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }

    // The screenshot inside a browser-ish frame, so it reads as a product shot rather
    // than a floating rectangle.

      const r = 12;
      const bar = Math.round(h * 0.052);

      ctx.save();
      ctx.shadowColor = t.edge;
      ctx.shadowBlur = 34;
      ctx.shadowOffsetY = 14;
      ctx.fillStyle = t.frame;
      roundRect(x, y, w, h, r);
      ctx.fill();
      ctx.restore();

      // Title bar with the three dots.
      ctx.save();
      roundRect(x, y, w, h, r);
      ctx.clip();
      ctx.fillStyle = state.theme === 'dark' ? '#1F2937' : '#F3F4F6';
      ctx.fillRect(x, y, w, bar);
      ctx.fillStyle = state.theme === 'dark' ? '#374151' : '#D1D5DB';
      const dr = Math.max(3, bar * 0.17);
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(x + bar * 0.75 + i * dr * 3.1, y + bar / 2, dr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // The image itself, clipped to the frame's lower area.
      const ix = x, iy = y + bar, iw = w, ih = h - bar;
      ctx.save();
      roundRect(x, y, w, h, r);
      ctx.clip();
      ctx.beginPath();
      ctx.rect(ix, iy, iw, ih);
      ctx.clip();

      if (state.shot) {
        const img = state.shot;
        const sa = img.naturalWidth / img.naturalHeight;
        const da = iw / ih;
        let dw, dh;
        if (state.fit === 'cover' ? sa > da : sa < da) { dh = ih; dw = ih * sa; }
        else { dw = iw; dh = iw / sa; }
        // Letterbox behind a "Fit" image so the gaps are a deliberate surface, not a hole.
        if (state.fit === 'contain') {
          ctx.fillStyle = state.theme === 'dark' ? '#0B1220' : '#FFFFFF';
          ctx.fillRect(ix, iy, iw, ih);
        }
        ctx.drawImage(img, ix + (iw - dw) / 2, iy + (ih - dh) / 2, dw, dh);
      } else {
        ctx.fillStyle = state.theme === 'dark' ? '#0B1220' : '#F9FAFB';
        ctx.fillRect(ix, iy, iw, ih);
        ctx.fillStyle = '#9CA3AF';
        ctx.font = `500 ${Math.round(ih * 0.055)}px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Load a screenshot on the left', ix + iw / 2, iy + ih / 2);
      }
      ctx.restore();
    }

    // ── The three layouts ─────────────────────────────────────────────────────
    function drawScreenshot(w, h, t) {
      background(w, h, t);
      lockup(w / 2, 58, 30, t.word);

      const head = $('headline').value.trim();
      const sub = $('subtitle').value.trim();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';

      let y = 132;
      if (head) {
        ctx.fillStyle = t.head;
        ctx.font = `700 46px ${FONT}`;
        const lines = wrap(head, w - 220);
        drawLines(lines, w / 2, y, 54);
        y += lines.length * 54;
      }
      if (sub) {
        ctx.fillStyle = t.sub;
        ctx.font = `400 20px ${FONT}`;
        const lines = wrap(sub, w - 300);
        y += 8;
        drawLines(lines, w / 2, y, 28);
        y += lines.length * 28;
      }

      const top = Math.max(y + 26, 180);
      const fw = w - 150;
      framedShot((w - fw) / 2, top, fw, h - top - 40, t);
    }

    function drawTile(w, h, t) {
      background(w, h, t);
      lockup(w / 2, h * 0.38, Math.round(h * 0.2), t.word);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      const sub = $('subtitle').value.trim() || 'Step-by-step guides, automatically.';
      ctx.fillStyle = t.sub;
      ctx.font = `400 ${Math.round(h * 0.062)}px ${FONT}`;
      drawLines(wrap(sub, w - 70), w / 2, h * 0.63, h * 0.085);
    }

    function drawMarquee(w, h, t) {
      background(w, h, t);
      lockup(w / 2, h * 0.3, Math.round(h * 0.13), t.word);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';

      let y = h * 0.52;
      const head = $('headline').value.trim();
      if (head) {
        ctx.fillStyle = t.head;
        ctx.font = `700 ${Math.round(h * 0.095)}px ${FONT}`;
        const lines = wrap(head, w - 240);
        drawLines(lines, w / 2, y, h * 0.115);
        y += lines.length * h * 0.115;
      }
      const sub = $('subtitle').value.trim();
      if (sub) {
        ctx.fillStyle = t.sub;
        ctx.font = `400 ${Math.round(h * 0.045)}px ${FONT}`;
        drawLines(wrap(sub, w - 320), w / 2, y + h * 0.045, h * 0.06);
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function render() {
      const spec = SPECS[state.asset];
      cv.width = spec.w;
      cv.height = spec.h;
      const t = THEMES[state.theme];

      ctx.clearRect(0, 0, spec.w, spec.h);
      if (state.asset === 'screenshot') drawScreenshot(spec.w, spec.h, t);
      else if (state.asset === 'tile') drawTile(spec.w, spec.h, t);
      else drawMarquee(spec.w, spec.h, t);

      $('sizetag').textContent = `${spec.label} — ${spec.w} x ${spec.h} px`;
      $('assetHint').textContent = spec.note;
      const isShot = state.asset === 'screenshot';
      $('shotGroup').style.display = isShot ? '' : 'none';
      $('fitGroup').style.display = isShot && state.shot ? '' : 'none';
      $('presetGroup').style.display = state.asset === 'tile' ? 'none' : '';
      $('dlHint').textContent = isShot && !state.shot
        ? 'Load a screenshot before downloading — the placeholder would ship otherwise.'
        : '';
      $('dl').disabled = isShot && !state.shot;
    }

    // ── Wiring ────────────────────────────────────────────────────────────────
    const presetSel = $('preset');
    PRESETS.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.k;
      o.textContent = p.k === 'custom' ? 'Custom (write your own)' : p.h;
      presetSel.appendChild(o);
    });

    function applyPreset() {
      const p = PRESETS.find((x) => x.k === presetSel.value);
      if (!p || p.k === 'custom') return;
      $('headline').value = p.h;
      $('subtitle').value = p.s;
      render();
    }
    presetSel.addEventListener('change', applyPreset);

    function seg(id, key, after) {
      $(id).addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        [...$(id).children].forEach((b) => b.classList.toggle('on', b === btn));
        state[key] = btn.dataset[key];
        if (after) after();
        render();
      });
    }
    seg('assetSeg', 'asset');
    seg('themeSeg', 'theme');
    seg('fitSeg', 'fit');

    ['headline', 'subtitle'].forEach((id) => $(id).addEventListener('input', render));

    $('file').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          state.shot = img;
          // 1280x800 is 1.6:1. A capture far from that gets heavily letterboxed, which
          // looks like a mistake in the listing, so say so rather than silently doing it.
          const a = img.naturalWidth / img.naturalHeight;
          const warn = $('shotWarn');
          if (a < 1.15 || a > 2.3) {
            warn.textContent = `This image is ${img.naturalWidth}x${img.naturalHeight} (${a.toFixed(2)}:1). The frame is about 1.75:1, so expect visible bars. A wider capture fills it better.`;
            warn.style.display = 'block';
          } else {
            warn.style.display = 'none';
          }
          render();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(f);
    });

    $('dl').addEventListener('click', () => {
      const spec = SPECS[state.asset];
      const slug = (presetSel.value && state.asset !== 'tile' ? presetSel.value : state.asset);
      cv.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `steply-${state.asset}-${slug}-${spec.w}x${spec.h}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }, 'image/png');
    });

    applyPreset();
    render();
  </script>
</body>

</html>
